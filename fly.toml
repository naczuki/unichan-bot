app = "unichan-bot"
primary_region = "nrt"

[build]

[env]
  DB_PATH = "/data/unychan.db"
  PORT = "8080"

[mounts]
  source = "unychan_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
